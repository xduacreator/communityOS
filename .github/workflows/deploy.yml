name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Sesuaikan direktori dengan lokasi folder aplikasi di VPS Anda
            cd /root/communityOS
            
            # Tarik perubahan terbaru dari branch main
            git pull origin main
            
            # Build ulang dari nol tanpa cache dan restart container
            docker compose build --no-cache
            docker compose up -d --force-recreate
            
            # Bersihkan cache image lama yang tidak terpakai
            docker image prune -f

name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@11.7.0

      - name: Install dependencies and verify audit report
        run: |
          set -o pipefail
          npm ci --json | node scripts/verify-npm-audit-report.mjs

      - name: Generate Prisma client
        run: npm exec --workspace @repo/api prisma generate

      - name: Build all applications
        run: npm run build

      - name: Run API tests
        run: npm test --workspace @repo/api -- --runInBand

      - name: Run runtime security smoke tests
        run: npm run test:security --workspace @repo/api

  operations-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operations scripts
        run: |
          bash -n scripts/operations/deploy.sh scripts/operations/backup.sh
          sh -n scripts/operations/backup-container.sh scripts/operations/restore-check.sh
          node --test scripts/operations/deploy.test.mjs
      - name: Verify backup and isolated restore with PostgreSQL
        run: bash scripts/operations/test-backup.sh

  deploy:
    needs: [verify, operations-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: community-os-production
      cancel-in-progress: false

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -eu
            cd /root/communityOS
            exec 9>/var/lock/community-os-operations.lock
            flock -w 1800 9
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            git merge --ff-only '${{ github.sha }}'
            bash scripts/operations/deploy.sh '${{ github.sha }}'
